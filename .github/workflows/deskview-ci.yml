name: Deskview CI

on:
  push:
    branches: [claude/desktop-browser-app]
    paths:
      - 'desktop-browser/**'
      - '.github/workflows/deskview-ci.yml'
  pull_request:
    paths:
      - 'desktop-browser/**'
      - '.github/workflows/deskview-ci.yml'
  workflow_dispatch:

concurrency:
  group: deskview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-browser/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-browser/app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Snack bundle is up to date
        run: npm run check:snack

      - name: Metro bundle for iOS (expo export)
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
        run: npx expo export --platform ios --output-dir dist
