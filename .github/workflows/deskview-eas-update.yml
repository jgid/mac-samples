# OPTIONAL: publishes the app as an EAS Update (branch "preview") that can be opened in Expo Go.
# Requires (see desktop-browser/README.md):
#   1. a free expo.dev account and `npx eas-cli init` once (writes extra.eas.projectId into app.json),
#   2. repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# Without EXPO_TOKEN the job is skipped (green), so this workflow is harmless by default.
name: Deskview EAS Update (optional)

on:
  workflow_dispatch:
  push:
    branches: [claude/desktop-browser-app]
    paths:
      - 'desktop-browser/app/**'

concurrency:
  group: deskview-eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-browser/app
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN secret not set – skipping EAS Update (optional path, see desktop-browser/README.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-browser/app/package-lock.json

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.present == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Require EAS projectId
        if: steps.token.outputs.present == 'true'
        run: |
          if ! node -e 'process.exit(require("./app.json").expo?.extra?.eas?.projectId ? 0 : 1)'; then
            echo "::error::app.json has no expo.extra.eas.projectId. Run 'npx eas-cli init' once and commit app.json."
            exit 1
          fi

      - name: Publish EAS Update (branch preview)
        if: steps.token.outputs.present == 'true'
        run: npx eas-cli@latest update --auto --branch preview --non-interactive
